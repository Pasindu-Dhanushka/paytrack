services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: paytrack
      POSTGRES_USER: paytrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrack -d paytrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: paytrack:1.0
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paytrack
      SPRING_DATASOURCE_USERNAME: paytrack
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: