
name: Publish Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: ./mvnw -Dtest=ExpenseServiceTest test

      - name: Build backend JAR
        run: ./mvnw -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pasindu-dhanushka/paytrack-backend:latest
            ghcr.io/pasindu-dhanushka/paytrack-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pasindu-Dhanushka/paytrack

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/pasindu-dhanushka/paytrack-frontend:latest
            ghcr.io/pasindu-dhanushka/paytrack-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pasindu-Dhanushka/paytrack
